# Builds the 3DS programs on every push: the editor (mwedit.3dsx) and the game (mwcell3d.3dsx).
# No game data is involved: the game is built without its romfs (it reads the data the player baked from their own
# Morrowind copy from the SD card: sdmc:/3ds/mwcell3d/data/).
name: Build 3DS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout MiniSharp2 (the game's scripting language)
        uses: actions/checkout@v4
        with:
          repository: MariuszOnik/minisharp2
          path: minisharp2

      # The repository is edited on Windows: Makefiles and shaders with CRLF line ends trip make and picasso here.
      - name: Line ends
        run: find . -type f \( -name 'Makefile*' -o -name '*.pica' -o -name '*.c' -o -name '*.h' \) -exec sed -i 's/\r$//' {} +

      - name: Editor (mwedit.3dsx)
        run: make -f Makefile.edit

      - name: Game (mwcell3d.3dsx, without game data)
        run: make ROMFS= MS2="$GITHUB_WORKSPACE/minisharp2"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-programs
          path: |
            mwedit.3dsx
            mwcell3d.3dsx
